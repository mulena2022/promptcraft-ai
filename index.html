<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta etiquetas SEO -->
    <title>Free AI Prompt Generator - Midjourney & DALL-E Builder</title>
    <meta name="description" content="Free tool to build photorealistic AI prompts for Midjourney, DALL-E, and Stable Diffusion. Select styles, lighting, and aspect ratios instantly.">
    <meta name="keywords" content="midjourney prompt generator, ai prompt builder, free prompt maker, dall-e prompts">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">⚡</span>
                <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                    PromptCraft AI
                </h1>
            </div>
            <span class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-2.5 py-1 rounded-full">
                Gratis & Open Tool
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Controls Column (Left - 2 Cols) -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- 1. Sujeto Principal -->
            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                <label class="block text-sm font-medium text-slate-300 mb-2">1. Sujeto o Idea Principal</label>
                <input type="text" id="subjectInput" 
                       placeholder="Ej: Un astronauta explorando un templo antiguo en Marte" 
                       class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <!-- 2. Estilo Artístico -->
            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                <label class="block text-sm font-medium text-slate-300 mb-3">2. Estilo Visual</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5" id="styleOptions">
                    <button type="button" data-value="Cyberpunk neon style" class="option-btn border border-slate-700 bg-slate-950 hover:border-indigo-500 p-2.5 rounded-lg text-sm transition text-left">🌆 Cyberpunk</button>
                    <button type="button" data-value="Cinematic 35mm film photograph" class="option-btn border border-slate-700 bg-slate-950 hover:border-indigo-500 p-2.5 rounded-lg text-sm transition text-left">🎬 Fotografía Cine</button>
                    <button type="button" data-value="Anime style, highly detailed" class="option-btn border border-slate-700 bg-slate-950 hover:border-indigo-500 p-2.5 rounded-lg text-sm transition text-left">🎨 Anime / Manga</button>
                    <button type="button" data-value="3D Octane Render, hyper-realistic" class="option-btn border border-slate-700 bg-slate-950 hover:border-indigo-500 p-2.5 rounded-lg text-sm transition text-left">💎 Render 3D</button>
                    <button type="button" data-value="Oil painting, impressionist style" class="option-btn border border-slate-700 bg-slate-950 hover:border-indigo-500 p-2.5 rounded-lg text-sm transition text-left">🖼️ Pintura al Óleo</button>
                    <button type="button" data-value="Minimalist vector illustration" class="option-btn border border-slate-700 bg-slate-950 hover:border-indigo-500 p-2.5 rounded-lg text-sm transition text-left">✏️ Vector Ilustración</button>
                </div>
            </div>

            <!-- 3. Iluminación y Cámara -->
            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">3. Iluminación</label>
                    <select id="lightingSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="">Ninguna elegida</option>
                        <option value="volumetric golden hour lighting">Hora Dorada (Golden Hour)</option>
                        <option value="dramatic neon backlight">Luz Neón Dramática</option>
                        <option value="soft studio lighting with soft shadows">Estudio Suave</option>
                        <option value="dark moody cinematic lighting">Oscura y Cinematográfica</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">4. Plano / Ángulo</label>
                    <select id="cameraSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="">Ninguno elegido</option>
                        <option value="wide-angle close-up shot">Plano Cerca (Close-up)</option>
                        <option value="epic wide shot panoramic view">Plano Panorámico Épico</option>
                        <option value="drone aerial perspective view">Vista Aérea / Dron</option>
                        <option value="macro detail shot 85mm lens">Detalle Macro</option>
                    </select>
                </div>
            </div>

            <!-- 5. Parámetros Midjourney / SD -->
            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                <label class="block text-sm font-medium text-slate-300 mb-2">5. Formato / Aspect Ratio</label>
                <div class="flex flex-wrap gap-3" id="arOptions">
                    <button type="button" data-ar="--ar 16:9" class="ar-btn border border-slate-700 bg-slate-950 px-3.5 py-1.5 rounded-lg text-sm">16:9 (Horizontal/YouTube)</button>
                    <button type="button" data-ar="--ar 9:16" class="ar-btn border border-slate-700 bg-slate-950 px-3.5 py-1.5 rounded-lg text-sm">9:16 (Vertical/Reels/TikTok)</button>
                    <button type="button" data-ar="--ar 1:1" class="ar-btn border border-slate-700 bg-slate-950 px-3.5 py-1.5 rounded-lg text-sm">1:1 (Cuadrado)</button>
                </div>
            </div>
        </div>

        <!-- Output Column (Right - 1 Col) -->
        <div class="space-y-6">
            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 sticky top-24">
                <h2 class="text-lg font-bold text-slate-200 mb-3 flex items-center justify-between">
                    <span>Prompt Generado</span>
                    <span class="text-xs text-indigo-400 font-normal">Formato en Inglés</span>
                </h2>

                <div id="outputBox" class="bg-slate-950 p-4 rounded-lg border border-slate-800 text-slate-300 font-mono text-sm min-h-[140px] break-words">
                    Escribe tu idea en la izquierda para ver la magia...
                </div>

                <button id="copyBtn" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition flex items-center justify-center space-x-2">
                    <span>📋 Copiar Prompt</span>
                </button>

                <!-- Espacio preparado para Monetización / Publicidad -->
                <div class="mt-8 border border-dashed border-slate-800 rounded-lg p-4 text-center">
                    <p class="text-xs text-slate-500">Espacio Publicitario / Google AdSense</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950 py-4 text-center text-xs text-slate-500">
        Construido con HTML + Tailwind CSS. 100% Client-Side.
    </footer>

    <!-- JavaScript Lógica App -->
    <script>
        let selectedStyle = '';
        let selectedAR = '';

        const subjectInput = document.getElementById('subjectInput');
        const lightingSelect = document.getElementById('lightingSelect');
        const cameraSelect = document.getElementById('cameraSelect');
        const outputBox = document.getElementById('outputBox');
        const copyBtn = document.getElementById('copyBtn');

        // Manejar selección de botones de Estilo
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('border-indigo-500', 'bg-indigo-950/40'));
                if (selectedStyle === btn.dataset.value) {
                    selectedStyle = '';
                } else {
                    selectedStyle = btn.dataset.value;
                    btn.classList.add('border-indigo-500', 'bg-indigo-950/40');
                }
                updatePrompt();
            });
        });

        // Manejar selección de Aspect Ratio
        document.querySelectorAll('.ar-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.ar-btn').forEach(b => b.classList.remove('border-indigo-500', 'bg-indigo-950/40'));
                if (selectedAR === btn.dataset.ar) {
                    selectedAR = '';
                } else {
                    selectedAR = btn.dataset.ar;
                    btn.classList.add('border-indigo-500', 'bg-indigo-950/40');
                }
                updatePrompt();
            });
        });

        // Escuchar inputs
        subjectInput.addEventListener('input', updatePrompt);
        lightingSelect.addEventListener('change', updatePrompt);
        cameraSelect.addEventListener('change', updatePrompt);

        // Función constructora del Prompt
        function updatePrompt() {
            const subject = subjectInput.value.trim();
            
            if (!subject) {
                outputBox.textContent = "Escribe tu idea a la izquierda para empezar...";
                return;
            }

            let parts = [subject];

            if (selectedStyle) parts.push(selectedStyle);
            if (cameraSelect.value) parts.push(cameraSelect.value);
            if (lightingSelect.value) parts.push(lightingSelect.value);
            
            // Añadir calidad por defecto
            parts.push("8k resolution, highly detailed, photorealistic");

            let finalPrompt = parts.join(", ");

            if (selectedAR) {
                finalPrompt += ` ${selectedAR}`;
            }

            outputBox.textContent = finalPrompt;
        }

        // Función Copiar al Portapapeles
        copyBtn.addEventListener('click', () => {
            const textToCopy = outputBox.textContent;
            if (textToCopy && !textToCopy.startsWith("Escribe tu idea")) {
                navigator.clipboard.writeText(textToCopy);
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = "¡Copiado con éxito! ✨";
                copyBtn.classList.replace('bg-indigo-600', 'bg-emerald-600');
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                    copyBtn.classList.replace('bg-emerald-600', 'bg-indigo-600');
                }, 2000);
            }
        });
    </script>
</body>
</html>
